name: Knowledge Atlas — daily AI-assist articles

# Runs once a day, generates up to 10 new articles per subject (8 subjects
# = up to 80/day) using a small local model (@xenova/transformers, running
# on this runner's CPU), then commits the result. No xAI key, no Anthropic
# key, no API key of any kind is used or required.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: .cache/transformers
          key: atlas-model-Xenova-LaMini-Flan-T5-248M

      - name: Install dependencies
        run: npm ci

      - name: Generate today's articles
        run: npm run ai:generate-daily

      - name: Commit generated articles
        run: |
          git config user.name "atlas-ai-assist[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/atlas/generated-data.json
          git diff --cached --quiet && echo "No new articles today." || \
            git commit -m "atlas: AI-assist daily articles ($(date -u +%F))"
          git push
