name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'bio-pedia/package-lock.json'

      - name: Install dependencies
        working-directory: bio-pedia
        run: npm ci

      - name: Run linter
        working-directory: bio-pedia
        run: npm run lint
        continue-on-error: true

      - name: Build production
        working-directory: bio-pedia
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://teds-lab.vercel.app' }}
          NODE_ENV: production
        run: npm run build:prod

      - name: Verify build output
        working-directory: bio-pedia
        run: |
          if [ -d "dist" ]; then
            echo "✓ Build output directory exists"
            ls -la dist/ | head -20
          else
            echo "✗ Build output directory missing"
            exit 1
          fi

      - name: Verify sitemap generated
        working-directory: bio-pedia
        run: |
          if [ -f "dist/sitemap.xml" ]; then
            echo "✓ Sitemap generated successfully"
            head -5 dist/sitemap.xml
          else
            echo "⚠ Sitemap not found (will be generated at runtime)"
          fi

      - name: Build status
        if: success()
        run: |
          echo "✅ Build completed successfully!"
          echo "Vercel will automatically deploy on push to main"
